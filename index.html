<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock AI Master</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script type="module" src="main.js"></script>
</head>
<body>

    <div class="app-container">
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand" id="home-btn">
                <span style="font-size: 1.4rem;"></span> Stock AI
            </div>

            <nav class="watchlist-nav">
                <h3>Watchlist</h3>
                
                <div class="sector-group">
                    <h4>Technology</h4>
                    <button class="ticker-btn" data-ticker="AAPL">Apple</button>
                    <button class="ticker-btn" data-ticker="NVDA">NVIDIA</button>
                    <button class="ticker-btn" data-ticker="MSFT">Microsoft</button>
                </div>

                <div class="sector-group">
                    <h4>Automotive</h4>
                    <button class="ticker-btn" data-ticker="TSLA">Tesla</button>
                    <button class="ticker-btn" data-ticker="RIVN">Rivian</button>
                </div>

                <div class="sector-group">
                    <h4>Korea</h4>
                    <button class="ticker-btn" data-ticker="005930">Samsung</button>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- Top Bar -->
            <header class="top-bar">
                <h2 id="page-title" class="page-title">Dashboard</h2>
                <div class="search-bar">
                    <input type="text" id="global-search" placeholder="Search Ticker...">
                </div>
            </header>

            <!-- DASHBOARD VIEW -->
            <div id="dashboard-view" class="view active">
                <!-- Market Indices -->
                <section class="indices-section">
                    <h3>Market Overview</h3>
                    <div class="indices-grid" id="indices-container">
                        <!-- Cards injected by JS -->
                    </div>
                </section>

                <!-- Trending -->
                <section class="trending-section">
                    <h3>Trending Now</h3>
                    <div class="stocks-grid" id="trending-container">
                        <!-- Cards injected by JS -->
                    </div>
                </section>
            </div>

            <!-- ANALYSIS VIEW -->
            <div id="analysis-view" class="view hidden">
                
                <!-- Stock Header -->
                <div class="stock-header">
                    <div class="stock-info-left">
                        <span id="analysis-ticker" class="badge">AAPL</span>
                        <h1 id="analysis-name">Apple Inc.</h1>
                    </div>
                    <div class="stock-price-right">
                        <div id="analysis-price" class="big-price">$182.50</div>
                        <div id="analysis-change" class="price-change text-up">+0.66%</div>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="tabs-nav">
                    <button class="tab-btn active" data-tab="chart">Chart</button>
                    <button class="tab-btn" data-tab="financials">Financials</button>
                    <button class="tab-btn" data-tab="news">News</button>
                    <button class="tab-btn" data-tab="compare">Compare</button>
                    <button class="tab-btn" data-tab="simulator">Simulator</button>
                </div>

                <div class="tab-content">
                    
                    <!-- Chart Tab -->
                    <div id="tab-chart" class="tab-pane active">
                        <div class="chart-container-box">
                            <div id="main-candlestick-chart"></div>
                        </div>
                    </div>

                    <!-- Financials Tab -->
                    <div id="tab-financials" class="tab-pane">
                        <div class="financial-cards">
                            <div class="f-card">
                                <h5>Market Cap</h5>
                                <span id="fin-mkt-cap">-</span>
                            </div>
                            <div class="f-card">
                                <h5>P/E Ratio</h5>
                                <span id="fin-per">-</span>
                            </div>
                            <div class="f-card">
                                <h5>Revenue Growth</h5>
                                <span id="fin-rev" class="text-up">-</span>
                            </div>
                        </div>
                    </div>

                    <!-- News Tab -->
                    <div id="tab-news" class="tab-pane">
                        <div id="news-feed"></div>
                    </div>

                    <!-- Compare Tab -->
                    <div id="tab-compare" class="tab-pane">
                        <div class="sim-controls">
                            <div class="control-group">
                                <label>Competitor Ticker</label>
                                <input type="text" id="compare-ticker-input" value="MSFT">
                            </div>
                            <button id="run-compare-btn">Compare</button>
                        </div>
                        <div class="chart-container-box">
                            <div id="comparison-chart"></div>
                        </div>
                    </div>

                    <!-- Simulator Tab -->
                    <div id="tab-simulator" class="tab-pane">
                        <div class="sim-controls">
                            <div class="control-group">
                                <label>Monthly Investment</label>
                                <input type="number" id="sim-amount" value="1000">
                            </div>
                            <div class="control-group">
                                <label>Duration</label>
                                <select id="sim-duration">
                                    <option value="1">1 Year</option>
                                    <option value="3" selected>3 Years</option>
                                    <option value="5">5 Years</option>
                                </select>
                            </div>
                            <button id="run-sim-btn">Run</button>
                        </div>
                        
                        <div class="financial-cards">
                            <div class="f-card">
                                <h5>Invested</h5>
                                <span id="sim-invested">-</span>
                            </div>
                            <div class="f-card">
                                <h5>Final Value</h5>
                                <span id="sim-final" class="text-up">-</span>
                            </div>
                            <div class="f-card">
                                <h5>Total Return</h5>
                                <span id="sim-yield" class="text-up">-</span>
                            </div>
                        </div>

                        <div class="chart-container-box">
                            <div id="simulator-chart"></div>
                        </div>
                    </div>

                </div>
            </div>

        </main>
    </div>

</body>
</html>
