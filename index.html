<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Command Center</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar glass-panel">
            <div class="logo">
                <i class="fa-solid fa-layer-group"></i> MCC
            </div>
            <ul class="nav-links">
                <li class="active" data-view="dashboard">
                    <i class="fa-solid fa-house"></i> <span>Dashboard</span>
                </li>
                <li data-view="simulator">
                    <i class="fa-solid fa-chart-line"></i> <span>Quant Tool</span>
                </li>
                <li data-view="beginner">
                    <i class="fa-solid fa-seedling"></i> <span>Easy Mode</span>
                </li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar glass-panel">
                <div class="market-status" id="market-status">
                    <!-- JS will populate this -->
                    <span class="status-dot"></span> Loading Market Status...
                </div>
                <div class="user-profile">
                    <i class="fa-solid fa-circle-user"></i>
                </div>
            </header>

            <div id="content-area" class="content-area">
                <!-- Dynamic Content Loaded Here -->
            </div>
        </main>

        <!-- AI Chatbot Floating Button -->
        <div class="chatbot-container" id="chatbot-container">
            <div class="chat-window glass-panel hidden" id="chat-window">
                <div class="chat-header">
                    <span>AI Assistant</span>
                    <button id="close-chat"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <div class="message bot">Hello! I'm your AI Analyst. Ask me about PER, RSI, or market trends.</div>
                </div>
                <div class="chat-input">
                    <input type="text" id="chat-input-field" placeholder="Ask a question...">
                    <button id="send-chat"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
            <button class="chat-fab" id="chat-fab">
                <i class="fa-solid fa-robot"></i>
            </button>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
